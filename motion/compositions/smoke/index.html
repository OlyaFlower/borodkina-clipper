<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Smoke · cover loop · 8 seconds</title>
    <!-- scripts/motion-render.sh copies the pinned GSAP from motion/node_modules and the cover into assets/. -->
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #smoke {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #smoke-cover,
      #smoke-sweep,
      #smoke-dust {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
      }
      #smoke-cover {
        z-index: 1;
        display: block;
        object-fit: cover;
        transform-origin: 50% 50%;
      }
      #smoke-sweep {
        z-index: 2;
        mix-blend-mode: screen;
      }
      #smoke-dust {
        z-index: 3;
      }
    </style>
  </head>
  <body>
    <div
      id="smoke"
      data-composition-id="smoke"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="8"
      data-fps="30"
    >
      <img
        id="smoke-cover"
        class="clip"
        data-start="0"
        data-duration="8"
        data-track-index="0"
        src="assets/cover.png"
        alt="Event cover"
      />
      <canvas
        id="smoke-sweep"
        class="clip"
        data-start="0"
        data-duration="8"
        data-track-index="1"
        data-track-kind="graphics"
        width="1920"
        height="1080"
      ></canvas>
      <canvas
        id="smoke-dust"
        class="clip"
        data-start="0"
        data-duration="8"
        data-track-index="2"
        data-track-kind="graphics"
        width="1920"
        height="1080"
      ></canvas>
    </div>
    <script>
      (() => {
        const DURATION = 8;
        const W = 1920;
        const H = 1080;

        // Effects fade in and out with sin^2(pi t / 8): exactly 0 at t = 0 and t = 8, so the first
        // frame is the untouched cover and the last frame wraps into the first (seamless loop).
        const envelope = (t) => Math.sin((Math.PI * t) / DURATION) ** 2;

        // ---- WebGL: a soft diagonal light sweep, screen-blended over the cover.
        const glCanvas = document.getElementById('smoke-sweep');
        const gl = glCanvas.getContext('webgl', { premultipliedAlpha: true, preserveDrawingBuffer: true, alpha: true });
        let drawSweep = () => {};
        // Throwing before the timeline registers makes the render fail (sub_timeline_script_failure),
        // so a runner without WebGL fails loudly instead of shipping a video without the effect.
        if (!gl) {
          throw new Error('smoke: WebGL is unavailable');
        } else {
          const vs = 'attribute vec2 p; varying vec2 uv; void main(){ uv = p * 0.5 + 0.5; gl_Position = vec4(p, 0.0, 1.0); }';
          const fs = `precision mediump float;
            varying vec2 uv;
            uniform float phase;
            uniform float strength;
            void main() {
              float d = (uv.x * 1.7778 + uv.y) / 2.7778;   // 0..1 along the diagonal
              float band = exp(-pow((d - phase) / 0.09, 2.0));
              float a = clamp(band * strength * 0.55, 0.0, 1.0);
              gl_FragColor = vec4(vec3(1.0, 0.96, 0.88) * a, a);
            }`;
          const compile = (type, source) => {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader));
            return shader;
          };
          const program = gl.createProgram();
          gl.attachShader(program, compile(gl.VERTEX_SHADER, vs));
          gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fs));
          gl.linkProgram(program);
          gl.useProgram(program);
          const buffer = gl.createBuffer();
          gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
          gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
          const loc = gl.getAttribLocation(program, 'p');
          gl.enableVertexAttribArray(loc);
          gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
          const phaseLoc = gl.getUniformLocation(program, 'phase');
          const strengthLoc = gl.getUniformLocation(program, 'strength');
          gl.viewport(0, 0, W, H);
          drawSweep = (t) => {
            gl.clearColor(0, 0, 0, 0);
            gl.clear(gl.COLOR_BUFFER_BIT);
            const strength = envelope(t);
            if (strength <= 0) return;
            gl.uniform1f(phaseLoc, -0.2 + 1.4 * (t / DURATION));
            gl.uniform1f(strengthLoc, strength);
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
          };
        }

        // ---- Canvas 2D: floating dust motes from a seeded PRNG (mulberry32), periodic in 8 s.
        const mulberry32 = (seed) => () => {
          seed |= 0;
          seed = (seed + 0x6d2b79f5) | 0;
          let r = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
          return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
        };
        const random = mulberry32(20261114);
        const motes = Array.from({ length: 140 }, () => ({
          x: random() * W,
          y: random() * H,
          r: 1 + random() * 2.5,
          ax: 20 + random() * 50,
          ay: 15 + random() * 40,
          phase: random() * Math.PI * 2,
          cycles: 1 + Math.floor(random() * 2), // whole cycles per loop keep it periodic
          alpha: 0.25 + random() * 0.45,
        }));
        const ctx = document.getElementById('smoke-dust').getContext('2d');
        const drawDust = (t) => {
          ctx.clearRect(0, 0, W, H);
          const k = envelope(t);
          if (k <= 0) return;
          const w = (2 * Math.PI * t) / DURATION;
          for (const m of motes) {
            const x = m.x + m.ax * Math.sin(w * m.cycles + m.phase);
            const y = m.y + m.ay * Math.cos(w * m.cycles + m.phase);
            ctx.globalAlpha = m.alpha * k;
            ctx.fillStyle = '#fff6e6';
            ctx.beginPath();
            ctx.arc(x, y, m.r, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.globalAlpha = 1;
        };

        const renderAt = (t) => {
          const time = Math.min(Math.max(t, 0), DURATION);
          drawSweep(time);
          drawDust(time);
        };

        // ---- GSAP: slow push-in and drift that returns to the identity transform at 8 s.
        const tl = gsap.timeline({ paused: true });
        tl.fromTo(
          '#smoke-cover',
          { scale: 1, x: 0, y: 0 },
          { scale: 1.06, x: -28, y: -12, duration: DURATION / 2, ease: 'sine.inOut' },
          0,
        );
        tl.to('#smoke-cover', { scale: 1, x: 0, y: 0, duration: DURATION / 2, ease: 'sine.inOut' }, DURATION / 2);
        // The canvases follow the timeline in preview; renders also seek them through hf-seek.
        const clock = { t: 0 };
        tl.to(clock, { t: DURATION, duration: DURATION, ease: 'none', onUpdate: () => renderAt(clock.t) }, 0);
        window.addEventListener('hf-seek', (e) => renderAt(e.detail.time));
        renderAt(0);
        window.__timelines = window.__timelines || {};
        window.__timelines['smoke'] = tl;
      })();
    </script>
  </body>
</html>
